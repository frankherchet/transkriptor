[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "transkriptor"
version = "0.1.0"
description = "MP4 to JSON transcription using Microsoft VibeVoice-ASR"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "frankherchet" }]
dependencies = [
  "fastapi[standard]>=0.115.0",
  "pydantic>=2.7.0",
]

[project.optional-dependencies]
asr = [
  "accelerate>=0.30.0",
  "bitsandbytes>=0.43.0",
  "torch>=2.3.0",
  "transformers>=4.45.0",
  "torchaudio>=2.3.0",
  "vibevoice @ git+https://github.com/microsoft/VibeVoice.git",
]
test = [
  "httpx>=0.27.0",
  "pytest>=8.0.0",
]

[project.scripts]
transkriptor = "transkriptor.cli:main"

[tool.fastapi]
entrypoint = "transkriptor.api:app"

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
